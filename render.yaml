services:
  - type: web
    name: bharul-call-server
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGIN
        value: https://bharul-call-server.onrender.com
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
      - key: MAX_CONNECTIONS_PER_IP
        value: "5"
      - key: MAX_MESSAGES_PER_MINUTE
        value: "120"
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
